<title>다시 그린 하늘</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap">
<style>
/* Layout: the whole screen is one real sky (stereographic projection). Choosing a constellation flies the sky to it. Controls float above and below the sky; lists open as bottom sheets. */
:root{
  --night:#080c19;      /* sky edge, page */
  --panel:rgba(20,27,47,.92);
  --panel-solid:rgba(17,23,42,.9);
  --line:#2a3452;
  --chalk:#f7efc6;      /* hand-drawn lines, primary action */
  --sticker:#ffcf3f;    /* vote stars */
  --text:#eef0f6; --sub:#a0a8bf; --dim:#677190;
  --danger:#ff9a85;
  --name:"Gowun Batang","Nanum Myeongjo",serif;
  --ui:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden;background:var(--night)}
body{color:var(--text);font-family:var(--ui);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
[hidden]{display:none!important}
h1,h2,h3{margin:0;font-family:var(--name);font-weight:700;text-wrap:balance;line-height:1.3}
p{margin:0}
b,strong{font-weight:400}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--chalk);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}

#sky{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

.inner{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}

/* entrance */
.intro{position:fixed;inset:0;z-index:15;background:#000;transition:opacity .9s ease}
.intro.gone{opacity:0;pointer-events:none}
.intro canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.intro .copy{position:absolute;left:0;right:0;top:44%;text-align:center;pointer-events:none;display:grid;gap:8px}
.intro h1{font-size:2.4rem;letter-spacing:-.01em;opacity:.18}
.intro .lead{font-size:.95rem;color:var(--sub)}
.intro .hint-up{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 40px);text-align:center;font-size:.86rem;color:var(--sub);pointer-events:none}
.intro .sr:focus{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 80px);transform:translateX(-50%);width:auto;height:auto;clip:auto;background:var(--chalk);color:var(--night);border-radius:999px;padding:8px 16px}
.intro:not([hidden]):not(.gone) ~ .top,.intro:not([hidden]):not(.gone) ~ .bottom{opacity:0}
.top,.bottom{transition:opacity .8s ease}

/* top */
.top{position:fixed;top:0;left:0;right:0;z-index:5;pointer-events:none;padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-bottom:30px;background:linear-gradient(to bottom,rgba(6,9,20,.72),rgba(6,9,20,.3) 60%,rgba(6,9,20,0))}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px}
.logo{font-family:var(--name);font-weight:700;font-size:1.02rem;color:var(--sub);letter-spacing:-.01em}
.clock{pointer-events:auto;font-size:.76rem;color:var(--sub);background:rgba(255,255,255,.07);border-radius:999px;padding:4px 11px;white-space:nowrap}
.right{display:flex;align-items:center;gap:6px}
.spin{pointer-events:auto;font-size:.76rem;color:var(--sub);background:rgba(255,255,255,.07);border-radius:999px;padding:4px 11px;white-space:nowrap}
.spin[aria-pressed="true"]{color:var(--chalk);box-shadow:inset 0 0 0 1px rgba(247,239,198,.35)}
.clock b{color:var(--text);display:inline-block;min-width:4.4em;text-align:right}
.title{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;gap:6px;margin-top:8px}
.arrow{pointer-events:auto;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--text);background:rgba(255,255,255,.07)}
.arrow svg{width:20px;height:20px}
.arrow:active{background:rgba(255,255,255,.14)}
.cname{pointer-events:auto;display:grid;justify-items:center;gap:1px;min-width:0;padding:2px 0}
.cname .ko{font-family:var(--name);font-weight:700;font-size:1.75rem;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.cname .meta{font-size:.8rem;color:var(--sub);display:flex;align-items:center;gap:4px;white-space:nowrap}
.cname .meta svg{width:12px;height:12px}

/* bottom */
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:5;pointer-events:none;padding-top:40px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px);background:linear-gradient(to top,rgba(6,9,20,.84),rgba(6,9,20,.36) 55%,rgba(6,9,20,0))}
.hint{font-size:.84rem;color:var(--sub);text-align:center;min-height:1.55em;margin-bottom:10px;overflow-wrap:anywhere}
.hint b{color:var(--chalk)}
.tools{display:flex;align-items:center;gap:6px;pointer-events:auto}
.pill{background:rgba(29,39,64,.9);border-radius:999px;padding:7px 13px;font-size:.84rem;color:var(--text)}
.pill:disabled{color:var(--dim)}
.pill[aria-pressed="true"]{box-shadow:inset 0 0 0 1px var(--chalk);color:var(--chalk)}
.tools .count{margin-left:auto;font-size:.8rem;color:var(--sub)}
.dock{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;margin-top:10px;pointer-events:auto}
.rankbtn{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:9px 14px;text-align:left;display:grid;min-width:0}
.rankbtn .l{font-size:.74rem;color:var(--sub)}
.rankbtn .s{font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rankbtn .s em{font-style:normal;font-family:var(--name);font-weight:700}
.primary{background:var(--chalk);color:var(--night);font-family:var(--name);font-weight:700;font-size:1rem;border-radius:16px;padding:0 18px;min-height:54px}
.primary:disabled{opacity:.45}

.vcard{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:14px 16px 12px}
.vtop{display:flex;align-items:center;gap:8px}
.vrank{font-family:var(--name);font-weight:700;color:var(--night);background:var(--sticker);border-radius:8px;padding:1px 8px;font-size:.9rem}
.vrank.plain{background:rgba(255,255,255,.1);color:var(--text)}
.vday{font-size:.8rem;color:var(--sub)}
.x{margin-left:auto;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--sub);background:rgba(255,255,255,.07)}
.x svg{width:16px;height:16px}
.vcard h2{font-size:1.5rem;margin-top:8px;overflow-wrap:anywhere}
.vby{font-size:.82rem;color:var(--sub);margin-top:2px}
.vby b{color:var(--text)}
.vstory{font-family:var(--name);font-size:.95rem;line-height:1.7;margin-top:8px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;white-space:pre-wrap}
.vstory.none{color:var(--dim);font-family:var(--ui);font-size:.86rem}
.vrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;margin-top:12px;align-items:center}
.nav{background:rgba(255,255,255,.07);border-radius:12px;padding:11px 14px;font-size:.84rem}
.nav:disabled{color:var(--dim)}
.starbtn{grid-column:2;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:11px 10px;font-family:var(--name);font-weight:700;background:var(--sticker);color:var(--night);font-size:.95rem;white-space:nowrap}
.starbtn svg{width:18px;height:18px;flex:none}
.starbtn[aria-pressed="true"]{background:transparent;color:var(--sticker);box-shadow:inset 0 0 0 1.5px var(--sticker)}
.starbtn:disabled{background:rgba(255,255,255,.07);color:var(--sub);box-shadow:none}
#vNext{grid-column:3}
.remove{display:block;margin:10px auto 0;color:var(--danger);font-size:.82rem}

/* sheet */
.scrim{position:fixed;inset:0;z-index:19;background:rgba(3,5,12,.35)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;max-width:520px;margin:0 auto;background:var(--panel-solid);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:22px 22px 0 0;max-height:86%;overflow-y:auto;overscroll-behavior:contain;padding-top:8px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(28px);opacity:.5}to{transform:none;opacity:1}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheet-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:4px}
.sheet-head h2{font-size:1.25rem}
.sheet-head button{font-size:.86rem;color:var(--sub);padding:4px 2px}
.sub-note{font-size:.8rem;color:var(--dim);margin-bottom:10px}
.notice{background:rgba(255,154,133,.1);color:var(--danger);border-radius:12px;padding:10px 12px;font-size:.84rem;margin-bottom:12px}

.list{list-style:none;margin:0;padding:0;display:grid}
.row{display:grid;grid-template-columns:26px 72px minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row .rk{font-family:var(--name);font-weight:700;font-size:1.1rem;text-align:center;color:var(--sub)}
.row.first .rk{color:var(--sticker)}
.row canvas{width:72px;height:54px;border-radius:8px;display:block}
.meta{min-width:0;display:grid}
.meta .nm{font-family:var(--name);font-weight:700;font-size:1.02rem;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta .by{font-size:.76rem;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta .by i{font-style:normal;color:var(--sticker)}
.me-tag{color:var(--chalk)}
.vote{display:inline-flex;flex-direction:column;align-items:center;gap:1px;min-width:46px;padding:6px 6px 5px;border-radius:12px;background:rgba(255,255,255,.06);color:var(--sub);font-size:.8rem}
.vote svg{width:20px;height:20px}
.vote[aria-pressed="true"]{background:rgba(255,207,63,.14);color:var(--sticker)}
.vote:disabled{opacity:.55}
.empty{background:rgba(255,255,255,.04);border-radius:14px;padding:20px 16px;color:var(--sub);font-size:.88rem}
.empty b{display:block;font-family:var(--name);font-weight:700;font-size:1.1rem;color:var(--text);margin-bottom:4px}
.yday{margin-top:22px}
.yday h3{font-size:.95rem;color:var(--sub);font-family:var(--ui);font-weight:400}
.yday .none{font-size:.84rem;color:var(--dim);padding:8px 0}

.prow{display:grid;grid-template-columns:72px minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.prow:last-child{border-bottom:0}
.prow canvas{width:72px;height:54px;display:block}
.credit{font-size:.72rem;color:var(--dim);margin-top:14px;line-height:1.5}
.prow .here{font-size:.74rem;color:var(--chalk);white-space:nowrap}
.prow .go{font-size:.78rem;color:var(--sticker);background:rgba(255,207,63,.12);border-radius:10px;padding:6px 10px;white-space:nowrap}

.form{display:grid;gap:10px}
.preview{display:flex;gap:12px;align-items:center;background:rgba(255,255,255,.04);border-radius:14px;padding:10px 12px}
.preview canvas{width:84px;height:63px;display:block;flex:none}
.preview p{font-size:.84rem;color:var(--sub)}
.preview p b{color:var(--text)}
.name-in{background:transparent;border:0;border-bottom:2px dashed var(--line);border-radius:0;padding:4px 0 6px;font-family:var(--name);font-weight:700;font-size:1.5rem;line-height:1.35;width:100%}
.name-in::placeholder{color:var(--dim)}
.name-in:focus{outline:none;border-bottom-color:var(--chalk)}
.story-in{font-family:var(--name);background:rgba(255,255,255,.05);border:1px solid transparent;border-radius:12px;padding:11px 12px;width:100%;box-sizing:border-box;resize:none;min-height:5em;line-height:1.6}
.story-in::placeholder{color:var(--dim)}
.story-in:focus{outline:none;border-color:var(--line)}
.counts{display:flex;justify-content:flex-end;gap:10px;font-size:.72rem;color:var(--dim);margin-top:-4px}
.form .primary{width:100%;padding:15px}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 132px);transform:translateX(-50%);z-index:30;background:var(--text);color:var(--night);font-size:.86rem;border-radius:12px;padding:10px 16px;max-width:min(420px,calc(100% - 32px));box-sizing:border-box;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.35);pointer-events:none}
.toast.err{background:var(--danger)}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
</style>

<canvas id="sky" aria-label="밤하늘. 고른 별자리의 별을 차례로 눌러 선을 이어요. 하늘을 좌우로 밀거나 다른 별자리 이름을 누르면 하늘이 그쪽으로 움직여요."></canvas>

<section class="intro" id="intro" aria-labelledby="introTitle">
  <canvas id="introSky" aria-hidden="true"></canvas>
  <div class="copy inner">
    <h1 id="introTitle">다시 그린 하늘</h1>
    <p class="lead">오늘 밤, 별을 다시 이어 보세요</p>
  </div>
  <p class="hint-up" id="introHint">작은 별을 위로 밀어 올려 주세요</p>
  <button type="button" class="sr" id="introOpen">하늘 열기</button>
</section>

<header class="top">
  <div class="inner">
    <div class="bar">
      <span class="logo">다시 그린 하늘</span>
      <span class="right"><button type="button" class="spin" id="spinBtn" aria-pressed="true">이동 연출 켜짐</button><span class="clock num">마감까지 <b id="countdown">--:--:--</b></span></span>
    </div>
    <div class="title" id="titleUI">
      <button class="arrow" id="prevC" aria-label="왼쪽 별자리로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg></button>
      <button class="cname" id="cname" aria-haspopup="dialog"><span class="ko" id="cKo"></span><span class="meta"><span id="cMeta"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></span></button>
      <button class="arrow" id="nextC" aria-label="오른쪽 별자리로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg></button>
    </div>
  </div>
</header>

<footer class="bottom">
  <div class="inner">
    <div id="drawUI">
      <p class="hint" id="hint"></p>
      <div class="tools">
        <button type="button" class="pill" id="undoBtn">되돌리기</button>
        <button type="button" class="pill" id="clearBtn">지우기</button>
        <button type="button" class="pill" id="ghostBtn" aria-pressed="false">원래 선</button>
        <span class="count num" id="lineCount"></span>
      </div>
      <div class="dock">
        <button type="button" class="rankbtn" id="rankBtn"><span class="l">오늘 순위</span><span class="s" id="rankSum">불러오는 중…</span></button>
        <button type="button" class="primary" id="openForm">이름 짓고 올리기</button>
      </div>
    </div>
    <div class="vcard" id="vcard" hidden>
      <div class="vtop">
        <span class="vrank" id="vRank"></span>
        <span class="vday" id="vDay"></span>
        <button type="button" class="x" id="vClose" aria-label="내 그림으로 돌아가기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
      <h2 id="vName"></h2>
      <p class="vby" id="vBy"></p>
      <p class="vstory" id="vStory"></p>
      <div class="vrow">
        <button type="button" class="nav" id="vPrev">이전</button>
        <button type="button" class="starbtn" id="vVote"></button>
        <button type="button" class="nav" id="vNext">다음</button>
      </div>
      <button type="button" class="remove" id="vRemove" hidden>내 작품 내리기</button>
    </div>
  </div>
</footer>

<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="inner">
    <div class="grab"></div>
    <div class="sheet-head"><h2 id="sheetTitle"></h2><button type="button" id="sheetClose">닫기</button></div>

    <div id="formBody" hidden>
      <div class="notice" id="formNotice" hidden></div>
      <form class="form" id="entryForm" novalidate>
        <div class="preview"><canvas id="formThumb"></canvas><p id="formInfo"></p></div>
        <label class="sr" for="nameInput">새 별자리 이름</label>
        <input class="name-in" id="nameInput" maxlength="20" placeholder="이름을 지어 주세요" autocomplete="off">
        <label class="sr" for="storyInput">이야기</label>
        <textarea class="story-in" id="storyInput" maxlength="140" rows="3" placeholder="왜 이렇게 보였는지 한두 줄 남겨 주세요"></textarea>
        <div class="counts num"><span id="nameLen">이름 0/20</span><span id="storyLen">이야기 0/140</span></div>
        <button type="submit" class="primary" id="submitBtn">오늘 하늘에 올리기</button>
      </form>
    </div>

    <div id="rankBody" hidden>
      <p class="sub-note">별자리마다 하루 한 작품에만 별을 줄 수 있어요. 다른 작품에 주면 별이 옮겨 가요.</p>
      <ol class="list" id="rankList"></ol>
      <div class="empty" id="rankEmpty" hidden></div>
      <div class="yday"><h3>어제 1위</h3><div id="yWinner"></div></div>
    </div>

    <div id="pickBody" hidden>
      <p class="sub-note">고르면 하늘이 그 별자리로 움직여요.</p>
      <ul class="list" id="pickList"></ul>
      <p class="credit">별의 위치·밝기·색은 히파르코스 위성 관측을 정리한 XHIP 목록, 은하수 모양은 d3-celestial의 은하수 윤곽 데이터를 썼어요. 성운과 은하는 실제 위치와 크기에 맞춰 그렸어요.</p>
    </div>
  </div>
</section>

<div class="toast" id="toast" role="status" hidden></div>

/* ---------- entrance: push the small star up; it grows and brightens until the sky opens ---------- */
const I = { on: false, p: 0, drag: null, doneT: 0, resolve: null };
const icv = $("#introSky"), ictx = icv.getContext("2d");

function drawIntro(now){
  if (!I.on) return;
  const G = introGeo(), { w, h } = G, dpr = Math.min(2, window.devicePixelRatio || 1);
  if (icv.width !== Math.round(w * dpr) || icv.height !== Math.round(h * dpr)){ icv.width = Math.round(w * dpr); icv.height = Math.round(h * dpr); }
  const x = ictx; x.setTransform(dpr, 0, 0, dpr, 0, 0); x.clearRect(0, 0, w, h);

  /* chevrons hinting upward while the star waits */
  if (p < .15 && !I.doneT){
    x.strokeStyle = COL.chalk; x.lineWidth = 1.6; x.lineCap = "round"; x.lineJoin = "round";
    for (let i = 0; i < 3; i++){
      const ph = ((now / 900) + i / 3) % 1, cy = sy - 34 - ph * 60;
      x.globalAlpha = Math.sin(Math.PI * ph) * .7 * (1 - p / .15);
      x.beginPath(); x.moveTo(sx - 8, cy + 5); x.lineTo(sx, cy - 3); x.lineTo(sx + 8, cy + 5); x.stroke();
    }
    x.globalAlpha = 1;
  }

  /* the star itself */
  /* the star itself: a point of light with a soft halo that twinkles, the way a bright star looks to the eye */
  if (p > 0){
    const amb = x.createRadialGradient(sx, sy, 0, sx, sy, Math.hypot(w, h) * .8);
    amb.addColorStop(0, `rgba(215,226,255,${.09 * p * p})`); amb.addColorStop(1, "rgba(215,226,255,0)");

  }

  const core = 1.1 + 2.6 * p, halo = (9 + 60 * Math.pow(p, 1.3)) * tw;

  x.fillStyle = "#fff"; x.beginPath(); x.arc(sx, sy, core, 0, 7); x.fill();

    b.addColorStop(0, `rgba(255,252,240,${.85 * k})`); b.addColorStop(1, "rgba(255,252,240,0)");

  $("#introHint").style.opacity = String(Math.max(0, 1 - p * 2.5));
  requestAnimationFrame(drawIntro);
}
function openSky(){

const ipt = ev => { const r = icv.getBoundingClientRect(); return { x: ev.clientX - r.left, y: ev.clientY - r.top }; };
icv.addEventListener("pointerdown", ev => {

  S.spin = load("rs-spin") !== false; renderSpin();
  tick(); setInterval(tick, 1000);
  renderTop(); renderBottom();
  S.cam = fit(S.cid); draw();
  const skyLoaded = fetch("sky.json").then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(d => { loadSky(d); if (!anim){ S.cam = fit(S.cid); draw(); } }).catch(() => {});
  const entered = data.cid ? ($("#intro").hidden = true, Promise.resolve()) : runIntro();
  Promise.all([skyLoaded, entered]).then(() => { if (!anim){ S.cam = fit(S.cid); startReveal(); } });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (!anim){ S.cam = fit(S.cid); draw(); } });
  connect();
}
if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({ drafts: S.drafts, cid: S.cid, ghost: S.ghost }));
const hot = window.claude && window.claude.hot;
hot && hot.ready ? hot.ready(start) : start((hot && hot.data) || {});
})();
</script>
